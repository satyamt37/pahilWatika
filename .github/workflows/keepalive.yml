name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. A tiny read every
# 3 days keeps the database available even during quiet weeks.
on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
    steps:
      - name: Call a public read-only function
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/rpc/site_stats" \
            -H "apikey: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
